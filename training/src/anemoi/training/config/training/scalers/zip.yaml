#  nodes_name: ${graph.data}
#  nodes_attribute_name: area_weight
#  scaling_mask_attribute_name: cutout_mask
#  weight_frac_of_total: ???
#  norm: "unit-sum"

# Purpose: "Limited Area Model nodes have special importance"
# Uses: lam_area_weight attribute (likely higher for LAM boundary regions)
# Norm: unit-sum → all weights sum to 1
# Effect: Emphasizes LAM boundary/interface regions where global→local coupling matters
lam_node_weights:
  _target_: anemoi.training.losses.scalers.GraphNodeAttributeScaler
  nodes_name: ${graph.input_nodes.data}
  nodes_attribute_name: lam_area_weight
  norm: "unit-sum"

# Purpose: "Only care about errors inside the limited area domain"
# Uses: cutout_mask (1 inside domain, 0 outside)
# Norm: null → uses raw 0/1 values
# Effect: Completely ignores errors outside the cutout region
limited_area_mask:
  _target_: anemoi.training.losses.scalers.GraphNodeAttributeScaler
  nodes_name: ${graph.input_nodes.data}
  nodes_attribute_name: cutout_mask
  norm: null

# Purpose: "Only care about errors outside the core LAM region"
# Uses: boundary_mask (inverse of cutout_mask)
# Effect: Focuses on boundary/transition zones, ignores LAM interior
outside_lam_mask:
  _target_: anemoi.training.losses.scalers.GraphNodeAttributeScaler
  nodes_name: ${graph.input_nodes.data}
  nodes_attribute_name: boundary_mask
  norm: null

