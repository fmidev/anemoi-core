defaults:
- data: zarr
- dataloader: native_grid
- diagnostics: evaluation
- system: slurm
- graph: multi_obs_debug
- model: graphtransformer_ens
- training: default
- _self_

config_validation: False

system:
  input:
    datasets: /scratch/project_462000975/anemoi/datasets/
    dataset_meps: aifs-meps-2.5km-2020-2025-6h-v7.zarr
    dataset_global_atm: aifs-od-an-oper-0001-mars-n320-2016-2025-6h-v9.zarr
    dataset_global_sfc_1: aifs-od-an-oper-0001-mars-n320-2016-2023-6h-v1-land.zarr
    dataset_global_sfc_2: aifs-od-an-oper-0001-mars-n320-2024-2025-6h-v1-land.zarr
    dataset_preform: meps-preform-onehot-2.5km-6h.zarr
    dataset: jajadingdong.zarr
    graph: /scratch/project_462000975/anemoi/output/aila-v2-multi-decoder/output/graphs/confused-orphan-md-v2.pt
    warm_start: /scratch/project_462000975/anemoi/output/aila-v2-multi-decoder/output/checkpoints/confused-orphan/confused_orphan_r6.ckpt
  output:
    root: /scratch/project_462000975/users/partio/bris-multi-decoder/output
    logs:
      mlflow: ${system.output.root}mlflow/

  hardware:
    num_gpus_per_model: 8
    num_gpus_per_node: 8
    num_gpus_per_ensemble: 16
    num_nodes: 32

dataloader:
  num_workers:
    training: 2
    validation: ${dataloader.num_workers.training}
    test: ${dataloader.num_workers.training}

  batch_size:
    training: 1
    validation: ${dataloader.batch_size.training}
    test: ${dataloader.batch_size.training}
  training:
    start: 2020-02-06
    end: 2024-05-31
  validation:
    start: 2024-06-01
    end: 2024-12-31
  test:
    start: null
    end: null

diagnostics:
  plot:
    callbacks: []
  log:
    mlflow:
      enabled: True
      offline: False
      tracking_uri: https://mlflow.out.ocp.fmi.fi
      experiment_name: aila-multi-decoder-preform
      run_name: ens-md-preform
      system: false
      expand_hyperparams:
      - config
    wandb:
      enabled: False
      entity: example

model:
  trainable_parameters:
    data: 0
    hidden: 0
    data2hidden: 0
    hidden2data: 0
    hidden2hidden: 0

  condition_on_residual: True
  num_channels: 1024

  processor:
    num_chunks: 4

#----------------------------------------------------------------------------------#
# Dataset specific part of the config
datasets:
  era_meps_sg:
    dataset:
      cutout:
      - dataset: ${system.input.datasets}${system.input.dataset_meps}
        trim_edge: 50
        reorder: sort
      - join:
        - dataset: ${system.input.datasets}${system.input.dataset_global_atm}
        - dataset:
            concat:
            - dataset: ${system.input.datasets}/${system.input.dataset_global_sfc_1}
            - dataset: ${system.input.datasets}/${system.input.dataset_global_sfc_2}
            select:
            - lcc
            - mcc
            - hcc
            - tcc
            - strd
            - ssrd
        adjust: ["start", "end"]
        reorder: sort
      min_distance_km: 0
      adjust: all
    select: ${selected_vars}
    reorder: sort

  obs:
    dataset: ${system.input.datasets}${system.input.dataset_preform}
    trim_edge: 50

selected_vars: ['10u', '10v', '2d', '2t', 'cos_julian_day', 'cos_latitude', 'cos_local_time', 'cos_longitude', 'hcc', 'insolation', 'lcc', 'lsm', 'mcc', 'msl', 'q_100', 'q_1000', 'q_150', 'q_200', 'q_250', 'q_300', 'q_400', 'q_50', 'q_500', 'q_700', 'q_850', 'q_925', 'sin_julian_day', 'sin_latitude', 'sin_local_time', 'sin_longitude', 'skt', 'sp', 'ssrd', 'strd', 't_100', 't_1000', 't_150', 't_200', 't_250', 't_300', 't_400', 't_50', 't_500', 't_700', 't_850', 't_925', 'tcc', 'tcw', 'tp', 'u_100', 'u_1000', 'u_150', 'u_200', 'u_250', 'u_300', 'u_400', 'u_50', 'u_500', 'u_700', 'u_850', 'u_925', 'v_100', 'v_1000', 'v_150', 'v_200', 'v_250', 'v_300', 'v_400', 'v_50', 'v_500', 'v_700', 'v_850', 'v_925', 'w_100', 'w_1000', 'w_150', 'w_200', 'w_250', 'w_300', 'w_400', 'w_50', 'w_500', 'w_700', 'w_850', 'w_925', 'z', 'z_100', 'z_1000', 'z_150', 'z_200', 'z_250', 'z_300', 'z_400', 'z_50', 'z_500', 'z_700', 'z_850', 'z_925']

training:
  model_task: anemoi.training.train.tasks.GraphEnsForecaster
  ensemble_size_per_device: 1
  strategy:
    _target_: anemoi.training.distributed.strategy.DDPEnsGroupStrategy
    num_gpus_per_ensemble: ${system.hardware.num_gpus_per_ensemble}
    num_gpus_per_model: ${system.hardware.num_gpus_per_model}
    read_group_size: ${dataloader.read_group_size}

  max_steps: 15000
  lr:
    warmup: 300
    rate: 1.0e-04
    iterations: ${training.max_steps}
    min: 3e-7
  precision: bf16-mixed
  training_loss: null
  validation_metrics: null
  variable_groups: null
  metrics: null
  run_id: null
  fork_run_id: null
  load_weights_only: true
  transfer_learning: true
  transfer_learning_rename_dict: null

  gradient_clip:
    val: 1.0
    algorithm: value

  # Freeze everything except the preform decoder
  submodules_to_freeze:
    - era_meps_sg
    - noise_injector
    - processor
    - processor_graph_provider
    - node_attributes.trainable_tensors.hidden

#----------------------------------------------------------------------------------#
per_dataset_overrides:
  era_meps_sg:
    data:
      dataset_specific:
        forcing: ['cos_julian_day', 'cos_latitude', 'cos_local_time', 'cos_longitude', 'lsm', 'z', 'sin_julian_day', 'sin_latitude', 'sin_local_time', 'sin_longitude', 'insolation']
        diagnostic: ['tp', 'ssrd', 'strd']
        processors:
          normalizer:
            _target_: anemoi.models.preprocessing.normalizer.InputNormalizer
            config:
              default: "mean-std"
              std:
              - "tp"
              min-max: null
              max:
              - "z"
              none:
              - cos_latitude
              - cos_longitude
              - sin_latitude
              - sin_longitude
              - cos_julian_day
              - cos_local_time
              - sin_julian_day
              - sin_local_time
              - insolation
              - lsm
              - lcc
              - mcc
              - hcc
              - tcc
    dataloader:
      grid_indices:
        _target_: anemoi.training.data.grid_indices.FullGrid
        nodes_name: era_meps_sg
    model:
      bounding:
      - _target_: anemoi.models.layers.bounding.ReluBounding
        variables:
        - tp
      - _target_: anemoi.models.layers.bounding.HardtanhBounding
        variables:
        - tcc
        - hcc
        - mcc
        - lcc
        min_val: 0
        max_val: 1
    training:
      scalers:
        node_weights:
          _target_: anemoi.training.losses.scalers.ReweightedGraphNodeAttributeScaler
          nodes_name: era_meps_sg
          nodes_attribute_name: area_weight
          scaling_mask_attribute_name: cutout_mask
          weight_frac_of_total: 0.25
          norm: "unit-sum"
      training_loss:
        _target_: anemoi.training.losses.kcrps.AlmostFairKernelCRPS
        scalers: ['pressure_level', 'general_variable', 'nan_mask_weights', 'node_weights']
        ignore_nans: False
        no_autocast: True
        alpha: 0.95
      validation_metrics:
        fkcrps:
          _target_: anemoi.training.losses.kcrps.AlmostFairKernelCRPS
          scalers: ['node_weights']
          ignore_nans: False
          alpha: 0.95
      variable_groups:
        default: sfc
        pl:
          param: [q, t, u, v, w, z]
      metrics: []

  obs:
    data:
      dataset_specific:
        forcing:
        - cos_latitude
        - cos_longitude
        - sin_latitude
        - sin_longitude
        - cos_julian_day
        - cos_local_time
        - sin_julian_day
        - sin_local_time
        - insolation
        - lsm
        - z
        # The six precipitation-type classes are diagnostics (output-only).
        # They are one-hot encoded in the dataset and must not be normalised.
        diagnostic:
        - preform_drizzle
        - preform_rain
        - preform_sleet
        - preform_snow
        - preform_freezing_drizzle
        - preform_freezing_rain
        processors:
          normalizer:
            _target_: anemoi.models.preprocessing.normalizer.InputNormalizer
            config:
              default: "mean-std"
              min-max: null
              max:
              - z
              none:
              - cos_latitude
              - cos_longitude
              - sin_latitude
              - sin_longitude
              - cos_julian_day
              - cos_local_time
              - sin_julian_day
              - sin_local_time
              - insolation
              - lsm
              # One-hot class probabilities: keep in [0, 1], do not standardise
              - preform_drizzle
              - preform_rain
              - preform_sleet
              - preform_snow
              - preform_freezing_drizzle
              - preform_freezing_rain
    dataloader:
      grid_indices:
        _target_: anemoi.training.data.grid_indices.FullGrid
        nodes_name: obs
    model:
      # Use the same lightweight decoder structure as the obs correction decoder:
      # no dedicated encoder. Residual prediction (predicting a diff) is disabled
      # because precipitation type is categorical — adding a difference to a
      # one-hot distribution is not meaningful.
      # qk_norm: True is also a workaround for the ROCm bf16 gradient explosion bug.
      encoder:
        use_encoder: False
      decoder:
        decoder_module:
          initialise_data_extractor_zero: False
          qk_norm: True
      residual:
        use_residual: False
      # MixtureCrossEntropyLoss applies log_softmax internally, so the model
      # outputs raw logits — no SoftmaxBounding is applied during training.
      # Apply softmax as a post-processing step in the inference pipeline instead.
      bounding: []
    training:
      scalers:
        node_weights:
          _target_: anemoi.training.losses.scalers.GraphNodeAttributeScaler
          nodes_name: obs
          nodes_attribute_name: area_weight
          norm: "unit-sum"
      training_loss:
        _target_: anemoi.training.losses.MixtureCrossEntropyLoss
        scalers: ['node_weights']
        ignore_nans: False
        num_classes: 6
        label_smoothing: 0.0
        # Per-class weights applied as (target * w).sum(-1) after CE.
        # Order: drizzle, rain, sleet, snow, freezing_drizzle, freezing_rain.
        # Rare and high-impact types (freezing) receive higher weight.
        # Recalibrated from deterministic run (fork_run_id: 5d964ac5565147cb9f0b887d296ba78e):
        # previous [4.0, 0.253, 3.175, 0.676, 4.0, 4.0] over-predicted drizzle and sleet.
        class_weights: [1.5, 0.4, 2.0, 0.8, 4.0, 4.0]
      validation_metrics:
        mixture_ce:
          _target_: anemoi.training.losses.MixtureCrossEntropyLoss
          scalers: ['node_weights']
          ignore_nans: True
          num_classes: 6
          label_smoothing: 0.0
          class_weights: null
      variable_groups:
        default: preform
        pl:
          param: []
      metrics: []
