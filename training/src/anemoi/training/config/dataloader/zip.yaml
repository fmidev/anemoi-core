# configs/training/dataloader/zip.yaml

prefetch_factor: 2
pin_memory: True

num_workers:
  training: 8
  validation: 8
  test: 8
  predict: 8

batch_size:
  training: 2
  validation: 4
  test: 4
  predict: 4

limit_batches:
  training: null
  validation: null
  test: 20
  predict: 20

# Upstream grid‐sampling settings
read_group_size: ${hardware.num_gpus_per_model}
grid_indices:
  _target_: anemoi.training.data.grid_indices.FullGrid
  nodes_name: ${graph.data}

# Fork‐specific inputs (defining your two streams)
dataset_data:
  cutout:
    - dataset: ${hardware.paths.data}${hardware.files.dataset_lam}
    - dataset: ${hardware.paths.data}${hardware.files.dataset}
  adjust: all

dataset_obs:
  dataset: ${hardware.paths.data}${hardware.files.dataset_obs}

# Upstream’s single‐dataset pointer wins in case of conflict
dataset: ${hardware.paths.data}/${hardware.files.dataset}

# =============================================================================
# Split definitions
# =============================================================================

training:
  dataset: ${dataloader.dataset}
  start: null
  end: 2020
  frequency: ${data.frequency}

validation:
  dataset: ${dataloader.dataset}
  start: 2021
  end: 2021
  frequency: ${data.frequency}
  validation_rollout: 1

test:
  dataset: ${dataloader.dataset}
  start: 2022
  end: null
  frequency: ${data.frequency}

predict:
  dataset: ${dataloader.dataset}
