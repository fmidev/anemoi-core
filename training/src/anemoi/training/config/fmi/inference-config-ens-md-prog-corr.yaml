start_date: 2025-04-14T00:00:00
end_date: 2025-04-14T00:00:00

run_sha: 

alias: 

checkpoints: 
  forecaster:
    checkpoint_path: /scratch/project_462000975/users/partio/bris-multi-decoder/output/checkpoint/${run_sha}/inference-last.ckpt
    leadtimes: 11

frequency: 6h

system:
  input:
    datasets: /scratch/project_462000975/anemoi/datasets
    dataset_lam: aifs-meps-2.5km-2020-2025-6h-v7.zarr
    dataset_obs: meps-corr-2.5km.zarr
    dataset_global_atm: aifs-od-an-oper-0001-mars-n320-2025-6h-v9.zarr
    dataset_global_sfc: aifs-od-an-oper-0001-mars-n320-2024-2025-6h-v1-land.zarr

output: /scratch/project_462000975/users/partio/bris-multi-decoder/output/netcdf/${run_sha}
workdir: /scratch/project_462000975/users/partio/tmp

hardware:
  num_gpus_per_node: 8
  num_gpus_per_model: 8
  num_nodes: 1
  num_members: 1 # Number of ensemble members

# If the user wants to release GPU cache and memory
# This option releases unused cached/memory used by torch
release_cache: False

datasets:
  era_meps_sg: 
    dataset:
      cutout:
      - dataset: ${system.input.datasets}/${system.input.dataset_lam}
        reorder: sort
        trim_edge: 50
      - join:
        - dataset: ${system.input.datasets}/${system.input.dataset_global_atm}
        - dataset: ${system.input.datasets}/${system.input.dataset_global_sfc}
          select: ["tcc", "hcc", "mcc", "lcc" ]
        reorder: sort
        adjust: ["start", "end"]
      adjust: all
      min_distance_km: 0
    select: ${selected_vars}
    reorder: sort

  obs: 
    dataset: 
      dataset: ${system.input.datasets}/${system.input.dataset_obs}
      trim_edge: 50
      rename:
        t: tcorr
        r: rcorr
        u: ucorr
        v: vcorr
        fg: fgcorr

dataloader:
  datamodule:
    _target_: bris.data.dataset.NativeGridDataset
    _convert_: all
  #num_workers: 1
  #prefetch_factor: null
model:
  _target_: bris.model.BrisPredictor
  _convert_: all


selected_vars: ['10u', '10v', '2d', '2t', 'cos_julian_day', 'cos_latitude', 'cos_local_time', 'cos_longitude', 'hcc', 'insolation', 'lcc', 'lsm', 'mcc', 'msl', 'q_100', 'q_1000', 'q_150', 'q_200', 'q_250', 'q_300', 'q_400', 'q_50', 'q_500', 'q_700', 'q_850', 'q_925', 'sin_julian_day', 'sin_latitude', 'sin_local_time', 'sin_longitude', 'skt', 'sp', 't_100', 't_1000', 't_150', 't_200', 't_250', 't_300', 't_400', 't_50', 't_500', 't_700', 't_850', 't_925', 'tcc', 'tcw', 'tp', 'u_100', 'u_1000', 'u_150', 'u_200', 'u_250', 'u_300', 'u_400', 'u_50', 'u_500', 'u_700', 'u_850', 'u_925', 'v_100', 'v_1000', 'v_150', 'v_200', 'v_250', 'v_300', 'v_400', 'v_50', 'v_500', 'v_700', 'v_850', 'v_925', 'w_100', 'w_1000', 'w_150', 'w_200', 'w_250', 'w_300', 'w_400', 'w_50', 'w_500', 'w_700', 'w_850', 'w_925', 'z', 'z_100', 'z_1000', 'z_150', 'z_200', 'z_250', 'z_300', 'z_400', 'z_50', 'z_500', 'z_700', 'z_850', 'z_925']


routing:
  - decoder_name: era_meps_sg
    domain_index: 0
    outputs:
      - netcdf:
          filename_pattern: ${output}/bris_orphan_pred_%Y%m%dT%HZ-${run_sha}-${alias}.nc
          variables: [2t,2d,10u,10v]
          domain_name: meps

  - decoder_name: obs
    domain_index: 0
    outputs:
      - netcdf:
          filename_pattern: ${output}/bris_orphan_md_%Y%m%dT%HZ-${run_sha}-${alias}.nc
          variables: [tcorr,rcorr,ucorr,vcorr,fgcorr]
          domain_name: meps
