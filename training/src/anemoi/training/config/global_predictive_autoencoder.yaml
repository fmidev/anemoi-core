# @package _global_
defaults:
- /data: zarr
- /dataloader: native_grid
- /diagnostics: evaluation
- /system: example
- /graph: predictive_n320_r6
- /model: graphtransformer
- /task: predictive_autoencoder
- /training: single
- override /training/scalers: predictive_autoencoder
- _self_

config_validation: True

# Stage 1 baseline: single-state N320, r6/512, joint codec and +6h forecast training.

hydra:
  output_subdir: null
  run:
    dir: .

# These paths are exported by batch_jobs/autoencoder/slurm_training.sh.
system:
  input:
    dataset: ${oc.env:ANEMOI_ERA5_DATASET}
    graph: ${oc.env:ANEMOI_AUTOENCODER_GRAPH}
    warm_start: null
  hardware:
    # One model replica per GPU.
    num_gpus_per_model: 1
  output:
    root: ${oc.env:ANEMOI_AUTOENCODER_OUTPUT}

data:
  frequency: 6h
  datasets:
    data:
      forcing:
      - cos_latitude
      - cos_longitude
      - sin_latitude
      - sin_longitude
      - cos_julian_day
      - cos_local_time
      - sin_julian_day
      - sin_local_time
      - insolation
      - lsm
      - z
      diagnostic: []
      processors:
        normalizer:
          _target_: anemoi.models.preprocessing.normalizer.InputNormalizer
          config:
            default: mean-std
            std: []
            min-max: []
            max:
            - z
            none:
            - cos_latitude
            - cos_longitude
            - sin_latitude
            - sin_longitude
            - cos_julian_day
            - cos_local_time
            - sin_julian_day
            - sin_local_time
            - insolation
            - lsm

dataloader:
  read_group_size: 1
  num_workers:
    training: 1
    validation: 1
    test: 1
  batch_size:
    training: 2
    validation: 2
    test: 2
  dataset:
    dataset: ${system.input.dataset}
    select:
    - cos_latitude
    - cos_longitude
    - sin_latitude
    - sin_longitude
    - cos_julian_day
    - cos_local_time
    - sin_julian_day
    - sin_local_time
    - insolation
    - lsm
    - z
    - sp
    - q_50
    - q_100
    - q_150
    - q_200
    - q_250
    - q_300
    - q_400
    - q_500
    - q_700
    - q_850
    - q_925
    - q_1000
    - t_50
    - t_100
    - t_150
    - t_200
    - t_250
    - t_300
    - t_400
    - t_500
    - t_700
    - t_850
    - t_925
    - t_1000
    - u_50
    - u_100
    - u_150
    - u_200
    - u_250
    - u_300
    - u_400
    - u_500
    - u_700
    - u_850
    - u_925
    - u_1000
    - v_50
    - v_100
    - v_150
    - v_200
    - v_250
    - v_300
    - v_400
    - v_500
    - v_700
    - v_850
    - v_925
    - v_1000
    - w_50
    - w_100
    - w_150
    - w_200
    - w_250
    - w_300
    - w_400
    - w_500
    - w_700
    - w_850
    - w_925
    - w_1000
    - z_50
    - z_100
    - z_150
    - z_200
    - z_250
    - z_300
    - z_400
    - z_500
    - z_700
    - z_850
    - z_925
    - z_1000
  training:
    datasets:
      data:
        dataset_config:
          dataset: ${dataloader.dataset}
          frequency: ${data.frequency}
        start: 1979-01-01
        end: 2021-12-31
  validation:
    datasets:
      data:
        dataset_config:
          dataset: ${dataloader.dataset}
          frequency: ${data.frequency}
        start: 2022-01-01
        end: 2022-12-31
  test:
    datasets:
      data:
        dataset_config:
          dataset: ${dataloader.dataset}
          frequency: ${data.frequency}
        start: 2023-01-01
        end: 2023-12-31

task:
  timestep: 6H
  forecast_steps: 1
  use_previous_state: False

graph:
  overwrite: False

model:
  num_channels: 512
  # Forcing context is projected independently from the persistent state latent.
  # Static context is encoded once per forward call; temporal context is encoded per target time.
  static_forcing_variables:
  - cos_latitude
  - cos_longitude
  - sin_latitude
  - sin_longitude
  - lsm
  - z
  temporal_forcing_variables:
  - cos_julian_day
  - cos_local_time
  - sin_julian_day
  - sin_local_time
  - insolation
  static_forcing_context_channels: 64
  temporal_forcing_context_channels: 64
  model:
    _target_: anemoi.models.models.AnemoiModelPredictiveAutoEncoder
    hidden_nodes_name: hidden
    latent_skip: True
    expected_num_forcing_fields: 11
    expected_num_prognostic_fields: 73
    require_bottleneck: True
  forcing_encoder:
    num_channels: ${model.num_channels}
    _target_: anemoi.models.layers.mapper.GraphTransformerForwardMapper
    trainable_size: ${model.edge_trainable_parameters.data2hidden}
    sub_graph_edge_attributes: ${model.attributes.edges}
    num_chunks: 4
    mlp_hidden_ratio: 4
    mlp_implementation: mlp
    num_heads: 16
    qk_norm: False
    cpu_offload: ${model.cpu_offload}
    gradient_checkpointing: True
    layer_kernels: ${model.layer_kernels}
    shard_strategy: edges
    graph_attention_backend: triton
    edge_pre_mlp: False
  state_context_aggregator:
    _target_: anemoi.models.layers.aggregator.ConcatMLPAggregator
    mlp_hidden_ratio: 2
    mlp_implementation: mlp
    n_extra_layers: 0
    final_activation: False
    layer_norm: True
    layer_kernels: ${model.layer_kernels}
  # Preserve the codec's original conditioning order; no encoded-data skip.
  decoders:
    "0":
      target_node_features: [forcings, coordinates, trainable_parameters]
  bounding:
    datasets:
      data: []

training:
  load_weights_only: False
  submodules_to_freeze: []
  precision: bf16-mixed
  max_epochs: null
  max_steps: 30000
  optimization:
    lr: 3.90625e-6
    lr_scheduler:
      warmup_t: 240
  scalers:
    datasets:
      data:
        # The codec reconstructs mean/std-normalized fields, so give every
        # prognostic variable and pressure level equal weight. In particular,
        # do not inherit the forecasting default of w: 0.001 here.
        reconstruction_variable:
          _target_: anemoi.training.losses.scalers.GeneralVariableLossScaler
          weights:
            default: 1.0
        time_steps:
          _target_: anemoi.training.losses.scalers.TimeStepScaler
          # Prioritise the codec while retaining a forecastability gradient.
          weights: [3.0, 1.0]
          norm: unit-sum
        reconstruction_time:
          _target_: anemoi.training.losses.scalers.TimeStepScaler
          weights: [1.0, 0.0]
          norm: unit-sum
        forecast_time:
          _target_: anemoi.training.losses.scalers.TimeStepScaler
          weights: [0.0, 1.0]
          norm: unit-sum
  training_loss:
    datasets:
      data:
        _target_: anemoi.training.losses.combined.CombinedLoss
        scalers: []
        ignore_nans: False
        losses:
        - _target_: anemoi.training.losses.MSELoss
          # Equal weighting in normalized variable space is the codec loss.
          scalers: [reconstruction_variable, node_weights, reconstruction_time]
          ignore_nans: False
        - _target_: anemoi.training.losses.MSELoss
          # Retain the established forecast-specific variable and level weights.
          scalers: [pressure_level, general_variable, node_weights, forecast_time]
          ignore_nans: False
        # Equivalent to the previous unit-sum time weights [3.0, 1.0].
        loss_weights: [0.75, 0.25]
  validation_metrics:
    datasets:
      data:
        reconstruction_mse:
          _target_: anemoi.training.losses.MSELoss
          scalers: [node_weights, reconstruction_time]
          ignore_nans: False
        forecast_mse:
          _target_: anemoi.training.losses.MSELoss
          scalers: [node_weights, forecast_time]
          ignore_nans: False
  metrics:
    datasets:
      data:
      - q_500
      - t_850
      - u_850
      - v_850
      - w_500
      - z_500
      - sp

diagnostics:
  checkpoint:
    every_n_epochs:
      num_models_saved: 3
  benchmark_profiler:
    memory:
      enabled: False
    time:
      enabled: False
    speed:
      enabled: False
    system:
      enabled: False
    model_summary:
      enabled: False
    snapshot:
      enabled: False
  log:
    mlflow:
      enabled: False
      tracking_uri: null
      # Uses Anemoi's AMD GPU monitor on LUMI; the environment must provide pyrsmi.
      system: True
  plot:
    settings:
      precip_and_related_fields: []
    parameters:
    - q_500
    - t_850
    - u_850
    - v_850
    - w_500
    - z_500
    - sp
    callbacks: []
